apiVersion: v1
kind: ServiceAccount
metadata:
  name: lens-viewer
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lens-viewer-role
rules:
  - apiGroups: ["", "apps", "batch", "extensions"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lens-viewer-binding
subjects:
  - kind: ServiceAccount
    name: lens-viewer
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: lens-viewer-role
  apiGroup: rbac.authorization.k8s.io
