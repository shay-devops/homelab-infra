---
- name: Retrieve Vaultwarden admin token from Vault
  ansible.builtin.set_fact:
    vaultwarden_admin_token: "{{ lookup('community.hashi_vault.vault_kv2_get', 'it-docs/vaultwarden', engine_mount_point='homelab', url=vault_addr, auth_method='approle', role_id=vault_role_id, secret_id=lookup('env', 'ANSIBLE_VAULT_SECRET_ID'), ca_cert=vault_ca_cert).secret.admin_token }}"
  no_log: true

- name: Retrieve MariaDB root password from Vault
  ansible.builtin.set_fact:
    mariadb_root_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'it-docs/mariadb', engine_mount_point='homelab', url=vault_addr, auth_method='approle', role_id=vault_role_id, secret_id=lookup('env', 'ANSIBLE_VAULT_SECRET_ID'), ca_cert=vault_ca_cert).secret.root_password }}"
  no_log: true

- name: Retrieve MariaDB app password from Vault
  ansible.builtin.set_fact:
    mariadb_app_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'it-docs/mariadb', engine_mount_point='homelab', url=vault_addr, auth_method='approle', role_id=vault_role_id, secret_id=lookup('env', 'ANSIBLE_VAULT_SECRET_ID'), ca_cert=vault_ca_cert).secret.app_password }}"
  no_log: true

- name: Retrieve BookStack APP_KEY from Vault
  ansible.builtin.set_fact:
    bookstack_app_key: "{{ lookup('community.hashi_vault.vault_kv2_get', 'it-docs/bookstack', engine_mount_point='homelab', url=vault_addr, auth_method='approle', role_id=vault_role_id, secret_id=lookup('env', 'ANSIBLE_VAULT_SECRET_ID'), ca_cert=vault_ca_cert).secret.app_key }}"
  no_log: true

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true

- name: Check if Docker is already installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary

- name: Download Docker install script
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: '0755'
  when: not docker_binary.stat.exists

- name: Run Docker install script
  ansible.builtin.command: /tmp/get-docker.sh
  when: not docker_binary.stat.exists
  changed_when: true
  become: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Create it-docs directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/it-docs
    - /opt/it-docs/caddy
    - /opt/it-docs/caddy/data
    - /opt/it-docs/caddy/config
    - /opt/it-docs/vaultwarden
    - /opt/it-docs/bookstack
    - /opt/it-docs/mariadb
  become: true

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/it-docs/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart it-docs stack

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/it-docs/docker-compose.yml
    owner: root
    group: root
    mode: '0600'
  no_log: true
  become: true
  notify: Restart it-docs stack

- name: Ensure it-docs stack is up
  ansible.builtin.command: docker compose -f /opt/it-docs/docker-compose.yml up -d
  args:
    chdir: /opt/it-docs
  changed_when: true
  become: true

- name: Wait for all it-docs containers to report running
  ansible.builtin.shell: >
    docker compose -f /opt/it-docs/docker-compose.yml ps
    --format '{% raw %}{{.State}}{% endraw %}' | grep -c '^running$'
  args:
    chdir: /opt/it-docs
  register: it_docs_running
  until: it_docs_running.stdout | int == 4
  retries: 18
  delay: 10
  changed_when: false
  become: true
