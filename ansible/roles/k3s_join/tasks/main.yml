---
- name: Retrieve k3s node-token from Vault
  ansible.builtin.set_fact:
    k3s_node_token: "{{ lookup('community.hashi_vault.vault_kv2_get', 'k3s/node-token', engine_mount_point='homelab', url=vault_addr, auth_method='approle', role_id=vault_role_id, secret_id=lookup('env', 'ANSIBLE_VAULT_SECRET_ID'), ca_cert=vault_ca_cert).secret.token }}"
  no_log: true

- name: Check if k3s binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_binary.stat.exists

- name: Install k3s in agent mode without starting it
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    K3S_URL: "{{ k3s_server_url }}"
    INSTALL_K3S_SKIP_START: "true"
  when: not k3s_binary.stat.exists
  changed_when: true

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write k3s agent config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      server: "{{ k3s_server_url }}"
      token: "{{ k3s_node_token }}"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart k3s-agent

- name: Ensure k3s-agent is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for k3s-agent to stay up
  ansible.builtin.command: systemctl is-active k3s-agent
  register: k3s_agent_state
  until: k3s_agent_state.stdout == "active"
  retries: 12
  delay: 5
  changed_when: false
